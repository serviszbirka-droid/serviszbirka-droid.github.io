<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Monitor for LuxPower</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --ink: #111827; --muted: #5b6472; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #070912; --card: #121624; --ink: #eef1f7; --muted: #9aa3b2; --accent: #60a5fa; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 420px; margin: 16px; padding: 28px 24px; background: var(--card); border-radius: 16px; text-align: center; }
  h1 { font-size: 1.3rem; margin: 0 0 .6rem; }
  p { color: var(--muted); margin: 0 0 1.2rem; }
  a.btn { display: block; padding: 14px; border-radius: 12px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Monitor for LuxPower</h1>
  <p>Щоб посилання відкрилося одразу в застосунку, встановіть його з Google Play. Якщо застосунок уже встановлено — відкрийте його й увійдіть логіном і паролем з повідомлення.</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=app.myinverter">Google Play</a>
</main>
</body>
</html>
